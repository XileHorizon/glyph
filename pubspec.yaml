name: ghost_md
description: "Ghost.md in Flutter: notes in plain Markdown."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # A formula drawn (lib/editor/maths): KaTeX's parser, layout and faces in Dart, Apache 2.0. The published
  # 0.7.4 with the changes its README names, kept here because they are in its layout and its parser.
  flutter_math_fork:
    path: packages/flutter_math_fork
  flutter_svg: ^2.3.0
  glacier:
    path: packages/glacier
  shared_preferences: ^2.5.6
  # Settings › Import (lib/importer): an Evernote export read as it streams, and each note's ENML as a document
  # (xml, already here under flutter_svg); a resource matched to its <en-media> by its MD5, as ENML names it
  # (crypto). Both pure Dart, from the Dart team and the xml package's author.
  xml: ^7.0.1
  crypto: ^3.0.7
  # Rich embeds (lib/editor/media/rich_embeds): a YouTube or Spotify player in its card, and a Figma file's
  # interactive embed full screen, each a web view made only once the person taps. Flutter's own plugin, with
  # Android's WebView and WebKit's WKWebView on the iPhone and the Mac; anywhere else a tap opens the link.
  webview_flutter: ^4.14.1
  # Each platform's own settings: a player started by the tap that made it, and played in its card.
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0
  # Settings › Contacts (lib/integrations/contacts, docs/INTEGRATIONS.md §2): the phone's own address book read on
  # this device, for a person named on a to-do, and nothing of it sent anywhere. Android, the iPhone and the Mac.
  flutter_contacts: ^2.6.0
  # A contact's card calls, texts and emails (`tel:`, `sms:`, `mailto:`) through Flutter's own launcher, on every
  # platform the contacts are read on; the app's own opener (core/open_link.dart) lets no `sms:` through.
  url_launcher: ^6.3.3
  archive: ^4.5.2
  # The web build (lib/web, docs/WEB.md; Matt, 2026-10-26: "update the web version of the app it's very behind"):
  # the browser's own IndexedDB, Worker, fetch and WebSocket, by the Dart team's bindings, which shared_preferences
  # and url_launcher already bring for their own web halves. Nothing of it is compiled into the phone's app.
  web: ^1.1.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # tool/perf_cpu.dart reads a profile build's CPU samples through the VM's own service.
  vm_service: ^15.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/css/ink.css
    - assets/css/app.css
    - assets/css/typefaces.css
    - assets/launch/ghost-icon-eyeless.webp
    # The ghost's scenes (lib/art/ghost.dart), the web app's own masks from src/app/art/ghosts.
    - assets/art/ghosts/
    # Ghost.md: The Guide (lib/guide/guidebook.dart): the web app's own index and chapters, src/app/guidebook.
    - assets/guidebook/
    - assets/guidebook/chapters/
    # A ```mermaid fence drawn as its diagram (lib/editor/diagrams): Mermaid itself, the release tauri/ pins, with
    # its licence, and the page it draws on in a web view nobody sees. Brought here by tool/diagram_page.mjs.
    - assets/diagrams/
    # The sample note's picture and the example canvas's picture card (lib/core/sample_library.dart): the web app's
    # own, src/app/assets/sample-smoke.jpg, a photograph of smoke by Jocelyn Morales from Unsplash (Unsplash License).
    - assets/sample/sample-smoke.jpg
    # What every test did the last time the whole suite was run (lib/diag/built_report.dart; Settings › Test
    # results): written by tool/test_report.mjs before a release is built, and the empty one in the repository.
    - assets/diag/test_report.json
    # Lovart's mark (lib/plugins/lovart/lovart_mark.dart), the circle with "Lo" cut out of its site's header,
    # www.lovart.ai, as read on 2026-10-26 (docs/LOVART.md). A third party's mark: drawn only in the Lovart plugin's
    # own places (its page, its actions, the chip by a cue, the badge on a picture it made), never in the store's.
    - assets/plugins/lovart/lovart-mark.svg
  # The bend (lib/art/wisp_kit.dart): feTurbulence and feDisplacementMap as a fragment shader, for the heat on
  # words and the scene's haze. The wisp's smoke, and its nine other shaders, gave way to a gradient blur
  # (2026-10-24). On Android that blur is a backdrop filter of edge_blur.frag, across and then down, its softness
  # growing toward the edge (lib/art/edge_backdrop.dart; 2026-10-25, where pictures of the view were too slow).
  shaders:
    - shaders/wisp_bend.frag
    - shaders/edge_blur.frag
  fonts:
    # The faces the web app ships (@fontsource-variable/inter, @fontsource/maple-mono), converted from their woff2
    # by tool/fonts.py. Inter comes in subsets, as it does on the page: Latin is the family, the rest fall back.
    - family: Inter Variable
      fonts:
        - asset: assets/fonts/InterVariable-latin.ttf
        - asset: assets/fonts/InterVariable-latin-Italic.ttf
          style: italic
    - family: Inter Variable LatinExt
      fonts:
        - asset: assets/fonts/InterVariable-latin-ext.ttf
        - asset: assets/fonts/InterVariable-latin-ext-Italic.ttf
          style: italic
    - family: Inter Variable Cyrillic
      fonts:
        - asset: assets/fonts/InterVariable-cyrillic.ttf
        - asset: assets/fonts/InterVariable-cyrillic-Italic.ttf
          style: italic
    - family: Inter Variable CyrillicExt
      fonts:
        - asset: assets/fonts/InterVariable-cyrillic-ext.ttf
        - asset: assets/fonts/InterVariable-cyrillic-ext-Italic.ttf
          style: italic
    - family: Inter Variable Greek
      fonts:
        - asset: assets/fonts/InterVariable-greek.ttf
        - asset: assets/fonts/InterVariable-greek-Italic.ttf
          style: italic
    - family: Inter Variable GreekExt
      fonts:
        - asset: assets/fonts/InterVariable-greek-ext.ttf
        - asset: assets/fonts/InterVariable-greek-ext-Italic.ttf
          style: italic
    - family: Inter Variable Vietnamese
      fonts:
        - asset: assets/fonts/InterVariable-vietnamese.ttf
        - asset: assets/fonts/InterVariable-vietnamese-Italic.ttf
          style: italic
    - family: Maple Mono
      fonts:
        - asset: assets/fonts/MapleMono-400.ttf
          weight: 400
        - asset: assets/fonts/MapleMono-500.ttf
          weight: 500
        - asset: assets/fonts/MapleMono-600.ttf
          weight: 600
        - asset: assets/fonts/MapleMono-700.ttf
          weight: 700
        - asset: assets/fonts/MapleMono-400-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/MapleMono-700-Italic.ttf
          weight: 700
          style: italic
    # The other faces Settings › Appearance › Type offers, as the page loads them (typefaces.css, the kit's fonts):
    # Fira Code and Noto Sans are variable in weight, IBM Plex Sans is the one weight the page registers.
    - family: Fira Code Variable
      fonts:
        - asset: assets/fonts/FiraCodeVariable-latin.ttf
    - family: Fira Code Variable LatinExt
      fonts:
        - asset: assets/fonts/FiraCodeVariable-latin-ext.ttf
    - family: Fira Code Variable Symbols
      fonts:
        - asset: assets/fonts/FiraCodeVariable-symbols2.ttf
    - family: Noto Sans Variable
      fonts:
        - asset: assets/fonts/NotoSansVariable-latin.ttf
        - asset: assets/fonts/NotoSansVariable-latin-Italic.ttf
          style: italic
    - family: Noto Sans Variable LatinExt
      fonts:
        - asset: assets/fonts/NotoSansVariable-latin-ext.ttf
        - asset: assets/fonts/NotoSansVariable-latin-ext-Italic.ttf
          style: italic
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-latin-400.ttf
    - family: IBM Plex Sans LatinExt
      fonts:
        - asset: assets/fonts/IBMPlexSans-latin-ext-400.ttf
    # Three more faces for the Market (Matt, 2026-10-26: "include some more themes, fonts"), Latin only, each variable
    # in weight and with its italic: Lora, a serif to read notes in; Atkinson Hyperlegible Next, a sans for the
    # interface drawn to be told apart letter from letter; JetBrains Mono, a coding face and the kit's own mono
    # (tokens.css `--glacier-font-mono`). OFL, as every face here is (assets/fonts/OFL.txt).
    - family: Lora Variable
      fonts:
        - asset: assets/fonts/LoraVariable-latin.ttf
        - asset: assets/fonts/LoraVariable-latin-Italic.ttf
          style: italic
    - family: Atkinson Hyperlegible Next Variable
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNextVariable-latin.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNextVariable-latin-Italic.ttf
          style: italic
    - family: JetBrains Mono Variable
      fonts:
        - asset: assets/fonts/JetBrainsMonoVariable-latin.ttf
        - asset: assets/fonts/JetBrainsMonoVariable-latin-Italic.ttf
          style: italic

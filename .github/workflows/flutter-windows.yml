# Flutter Ghost.md for Windows: build the notes core and desktop app, prove that it launches, and publish a
# screenshot on the public ci-shots branch so phase-one verification does not require artifact authentication.
name: Flutter Windows build

on:
  workflow_dispatch:
  push:
    branches: [feature/flutter-windows]

permissions:
  contents: write

concurrency:
  group: flutter-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Tool versions
        shell: pwsh
        run: |
          flutter --version
          rustc --version
          cargo --version
      - name: Build the notes core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo build --manifest-path native/Cargo.toml --release 2>&1 | Tee-Object native-build.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = Get-Content native-build.txt -Tail 150
            $important = $tail | Select-String -Pattern 'error(\[|:)|failed|Caused by|fatal|cannot find|not found|unresolved' | Select-Object -Last 10
            @($important; $tail) | Select-Object -First 150 | ForEach-Object { Write-Output "::error title=native build::$_" }
            exit $code
          }
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze Windows changes
        shell: pwsh
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings --no-pub lib
      - name: Build Flutter for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release --build-name 2.3.45 --build-number ${{ github.run_number }} *>&1 | Tee-Object flutter-build.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = Get-Content flutter-build.txt -Tail 150
            $important = $tail | Select-String -Pattern 'Error:|error:|FAILED|FAILURE|fatal|CMake Error|Exception' | Select-Object -Last 10
            @($important; $tail) | Select-Object -First 150 | ForEach-Object { Write-Output "::error title=Flutter Windows build::$_" }
            exit $code
          }
      - name: Bundle the notes core
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          Copy-Item 'native/target/release/ghost_core.dll' "$release/ghost_core.dll"
          if (-not (Test-Path "$release/ghost_md.exe")) { throw 'Ghost.md executable was not built.' }
          if (-not (Test-Path "$release/ghost_core.dll")) { throw 'ghost_core.dll was not bundled.' }
      - uses: actions/upload-artifact@v5
        with:
          name: ghost-md-flutter-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
      - name: Launch Ghost.md and capture the desktop
        id: launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'ghost-md-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'ghost-md-stderr.txt'
          $shot = Join-Path $env:RUNNER_TEMP 'glyph-flutter-windows.png'
          $process = Start-Process -FilePath (Join-Path $release 'ghost_md.exe') -WorkingDirectory $release -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            Write-Output "::error title=Ghost.md launch::The app exited with code $($process.ExitCode)."
            if (Test-Path $stdout) { Get-Content $stdout -Tail 150 | ForEach-Object { Write-Output "::error title=app stdout::$_" } }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 150 | ForEach-Object { Write-Output "::error title=app stderr::$_" } }
            exit 1
          }
          $native = @'
          using System;
          using System.Runtime.InteropServices;
          public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          public static class GhostWindow {
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extraInfo);
          }
          '@
          Add-Type -TypeDefinition $native
          $process.Refresh()
          $handle = $process.MainWindowHandle
          if ($handle -eq 0) { throw 'Ghost.md did not create a visible window.' }
          $rect = New-Object RECT
          if (-not [GhostWindow]::GetWindowRect($handle, [ref]$rect)) { throw 'Could not locate the Ghost.md window.' }
          [GhostWindow]::SetForegroundWindow($handle) | Out-Null
          # The account gate's centered guest button is 82% down the app window. Use it so the screenshot proves
          # the local library and notes UI, not merely that the account gate can open.
          $guestX = [int](($rect.Left + $rect.Right) / 2)
          $guestY = [int]($rect.Top + (($rect.Bottom - $rect.Top) * 0.82))
          [GhostWindow]::SetCursorPos($guestX, $guestY) | Out-Null
          [GhostWindow]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
          [GhostWindow]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Seconds 5
          # A fresh local library opens the first-run tour. Skip it to expose the real library and sample notes.
          [GhostWindow]::SetCursorPos($rect.Right - 45, $rect.Top + 20) | Out-Null
          [GhostWindow]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
          [GhostWindow]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            Write-Output "::error title=Ghost.md launch::The app exited after opening the local library, code $($process.ExitCode)."
            if (Test-Path $stderr) { Get-Content $stderr -Tail 150 | ForEach-Object { Write-Output "::error title=app stderr::$_" } }
            exit 1
          }
          [GhostWindow]::SetCursorPos($rect.Right - 8, $rect.Bottom - 8) | Out-Null
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Left, $bounds.Top, 0, 0, $bitmap.Size)
          $bitmap.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bitmap.Dispose()
          if ((Get-Item $shot).Length -lt 10000) { throw 'The launch screenshot is unexpectedly small.' }
          "screenshot=$shot" >> $env:GITHUB_OUTPUT
          Stop-Process -Id $process.Id -Force
      - name: Publish launch screenshot
        shell: pwsh
        env:
          SHOT: ${{ steps.launch.outputs.screenshot }}
        run: |
          $ErrorActionPreference = 'Stop'
          $target = "flutter-windows/${{ github.run_id }}.png"
          $saved = Join-Path $env:RUNNER_TEMP 'glyph-flutter-windows-saved.png'
          $shots = Join-Path $env:RUNNER_TEMP 'ci-shots-worktree'
          Copy-Item $env:SHOT $saved
          git fetch origin ci-shots 2>$null
          $hasShotsBranch = $LASTEXITCODE -eq 0
          if ($hasShotsBranch) {
            git worktree add --detach $shots origin/ci-shots
          } else {
            git worktree add --detach $shots HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the screenshot worktree.' }
            git -C $shots checkout --orphan ci-shots
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the ci-shots branch.' }
            git -C $shots read-tree --empty
            if ($LASTEXITCODE -ne 0) { throw 'Could not empty the new ci-shots branch.' }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out the ci-shots worktree.' }
          git -C $shots config user.name 'github-actions[bot]'
          git -C $shots config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          New-Item -ItemType Directory -Force (Split-Path (Join-Path $shots $target)) | Out-Null
          Copy-Item $saved (Join-Path $shots $target)
          git -C $shots add -- $target
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the launch screenshot.' }
          git -C $shots commit -m "Add Flutter Windows launch screenshot for run ${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the launch screenshot.' }
          git -C $shots push origin HEAD:ci-shots
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the launch screenshot.' }
          Write-Output "::notice title=Launch screenshot::https://raw.githubusercontent.com/XileHorizon/glyph/ci-shots/$target"

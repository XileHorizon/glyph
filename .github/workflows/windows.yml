# Ghost.md for Windows: the installer, built on a Windows runner (tauri/docs/DESIGN.md §208).
#
# The Windows app is the Tauri app, which lives in tauri/ since the repository's root became the Flutter app
# (docs/CUTOVER.md §5): every step below runs there. The Mac app is built on Matt's Mac by tauri/scripts/deploy-ota.mjs;
# a Mac cannot build the Windows app (the speech and language engines are C++ built with MSVC), so this does, by hand
# (Run workflow) or on a push to the `windows` branch. What it makes is the NSIS installer as an artifact;
# tauri/scripts/deploy-windows.mjs fetches it and puts it on the site. Signed only where the repository holds a certificate (WINDOWS_CERTIFICATE, a base64 .pfx, and
# WINDOWS_CERTIFICATE_PASSWORD): without one the installer is unsigned and Windows asks before running it.
name: Windows build

on:
  workflow_dispatch:
  push:
    # feature/margin-markers: Kevin's test builds of the Margin view, from his fork.
    branches: [windows, feature/margin-markers]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tauri

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # `uses:` steps do not take the working directory above: the lockfile is named.
          cache-dependency-path: tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
          # The engines' C++ takes a quarter of an hour: kept even when the app's own code then fails to build.
          cache-on-failure: true

      - run: npm ci

      # bindgen (whisper-rs-sys, llama-cpp-sys-2) reads the C headers with libclang, which the runner's LLVM has.
      # On a failure, the log's last lines are written as the run's error, so they can be read from the run's page and
      # its public annotations without downloading the log.
      - name: Build the installer
        shell: bash
        run: |
          set -o pipefail
          if ! npx tauri build --bundles nsis 2>&1 | tee build.log; then
            tail -n 80 build.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Build the installer::/'
            echo
            exit 1
          fi
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin

      # It built; does it run? The installer run silently as a person's double click would, the app started, and a look
      # twenty seconds later: still up, with a window, and what the screen shows kept beside the installer.
      - name: Install it and start it
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Ghost.md", "$env:ProgramFiles\Ghost.md" -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $app) { throw 'The installer left no app behind.' }
          "installed: $($app.FullName)"
          $running = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 20
          $running.Refresh()
          if ($running.HasExited) { throw "The app exited with code $($running.ExitCode)." }
          "window: '$($running.MainWindowTitle)' handle $($running.MainWindowHandle)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $shot.Save("$PWD\windows-first-launch.png")
          Stop-Process -Id $running.Id -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghost-md-windows-first-launch
          path: tauri/windows-first-launch.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: tauri/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ghost-md-windows
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
